spring:
  data:
    mongodb:
      # Direct seed-list URI (no mongodb+srv). Northflank's egress appears to hang/drop the
      # SRV+TXT DNS lookups mongodb+srv:// requires during MongoClient construction, which
      # blocks Tomcat's bind indefinitely (Tomcat start is gated behind all singleton beans).
      # MONGODB_HOSTS/MONGODB_REPLICA_SET default to this cluster's current shard members
      # (resolved via `nslookup -type=SRV`/`-type=TXT` on cluster0.le8yrdn.mongodb.net) -
      # override via env if Atlas ever rotates them.
      uri: mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@${MONGODB_HOSTS:ac-bzevybn-shard-00-00.le8yrdn.mongodb.net:27017,ac-bzevybn-shard-00-01.le8yrdn.mongodb.net:27017,ac-bzevybn-shard-00-02.le8yrdn.mongodb.net:27017}/?ssl=true&replicaSet=${MONGODB_REPLICA_SET:atlas-q4gspl-shard-0}&authSource=admin&retryWrites=true&w=majority
      auto-index-creation: false

logging:
  level:
    root: WARN
    com.ailegacy.modernization.copilot: INFO
    org.springframework.security: WARN
  file:
    name: /var/log/ai-legacy-copilot/application.log

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000
  refresh-expiration-ms: 604800000

app:
  temp-directory: /var/ai-legacy-copilot/temp
  output-directory: /var/ai-legacy-copilot/output
